name: E2E

# Runs the suite against SafetyOpsApp started from a pinned commit with docker compose.
# Bump SAFETYOPS_APP_REF deliberately when the app changes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SAFETYOPS_APP_REPO: jamesmyers4/SafetyOpsApp
  SAFETYOPS_APP_REF: e5d40d869454d12354f96634296beb9477d6ab7f
  DOTNET_NOLOGO: true

jobs:
  e2e:
    name: Selenium E2E (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Separate folders: the test project compiles every *.cs under its own directory.
      - name: Check out tests
        uses: actions/checkout@v5
        with:
          path: tests

      - name: Check out SafetyOpsApp
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SAFETYOPS_APP_REPO }}
          ref: ${{ env.SAFETYOPS_APP_REF }}
          path: app

      - name: Start SafetyOpsApp (fresh demo data)
        working-directory: app
        run: docker compose up -d --build

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      # The runner image ships Chrome; Selenium Manager fetches a matching ChromeDriver.
      - name: Build tests
        working-directory: tests
        run: dotnet build SafetyOpsTests-Selenium.slnx --configuration Release

      - name: Wait for the app
        run: |
          for _ in $(seq 1 60); do
            curl -fsS http://localhost:8080/healthz && exit 0
            sleep 2
          done
          echo "SafetyOpsApp did not become healthy" >&2
          exit 1

      - name: Run tests
        working-directory: tests
        run: >
          dotnet test SafetyOpsTests-Selenium.slnx --no-build --configuration Release
          --logger "trx;LogFileName=e2e.trx" --logger "console;verbosity=normal"
          --results-directory TestResults

      - name: App logs
        if: failure()
        working-directory: app
        run: docker compose logs --no-color

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/TestResults/*.trx
          if-no-files-found: ignore

      - name: Upload screenshots and page source
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts
          path: tests/bin/Release/net10.0/test-artifacts/
          if-no-files-found: ignore

      - name: Stop the app
        if: always()
        working-directory: app
        run: docker compose down -v
